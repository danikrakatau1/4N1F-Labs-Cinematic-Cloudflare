name: Bali Lab Route Check

on:
  push:
    branches:
      - lab/bali-candi-bentar-v1
  pull_request:
    paths:
      - 'src/worker.js'
      - 'editor/webgl-lab/bali/**'
      - '.github/workflows/bali-lab-route-check.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated Bali lab contract
        shell: bash
        run: |
          set -euo pipefail
          test -f editor/webgl-lab/bali/index.html
          grep -Fq "4N1F_BA11CA1D1A01" src/worker.js
          grep -Fq "p_ba11ca1d1a0100000000000000000000" src/worker.js
          grep -Fq "BALI_LAB_ASSET = '/editor/webgl-lab/bali/index.html'" src/worker.js
          grep -Fq "packageKey === BALI_LAB_KEY" src/worker.js
          grep -Fq "const PREVIEW_PATH = /^\\/p_" src/worker.js
          grep -Fq "const EDITOR_PATH = /^\\/editor\\/p_" src/worker.js
          grep -Fq "const KV_API = 'https://4n1f-kv-api.faqihanif12282000.workers.dev'" src/worker.js
          echo "Bali Lab isolated key/preview contract OK"
