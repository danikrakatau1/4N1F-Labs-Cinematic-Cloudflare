name: Production Acceptance V1

on:
  push:
    branches:
      - test/production-acceptance-v1
    paths:
      - 'tests/production-acceptance-v1.mjs'
      - '.github/workflows/production-acceptance-v1.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run consolidated production acceptance
        run: node tests/production-acceptance-v1.mjs
      - name: Upload acceptance ZIP proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-v1-proof
          path: artifacts/*.zip
          if-no-files-found: ignore
          retention-days: 3
