name: Bootstrap Cloudflare edition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cloudflare repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone frozen 4N1F source snapshot
        run: |
          rm -rf /tmp/4n1f-source
          git clone --quiet https://github.com/danikrakatau1/4NIF-Labs-Cinematic.git /tmp/4n1f-source
          git -C /tmp/4n1f-source checkout --quiet 0e7119054a3e1d88a97f03f4d53138ef89ba9edc

      - name: Copy active frontend and editor engine only
        run: |
          cp /tmp/4n1f-source/index.html ./index.html
          cp /tmp/4n1f-source/preview.html ./preview.html

          mkdir -p editor/addons
          cp /tmp/4n1f-source/editor/index.html editor/index.html
          cp /tmp/4n1f-source/editor/editor.css editor/editor.css
          cp /tmp/4n1f-source/editor/editor.js editor/editor.js
          cp /tmp/4n1f-source/editor/background-fluid.css editor/background-fluid.css
          cp /tmp/4n1f-source/editor/background-fluid.js editor/background-fluid.js
          cp /tmp/4n1f-source/editor/addons/v1.2.3-layer-engine.js editor/addons/v1.2.3-layer-engine.js
          cp /tmp/4n1f-source/editor/addons/v1.2.4-align-responsive.js editor/addons/v1.2.4-align-responsive.js
          cp /tmp/4n1f-source/editor/addons/v1.2.5-multiselect-group.js editor/addons/v1.2.5-multiselect-group.js
          cp /tmp/4n1f-source/editor/addons/v1.3.2-kv-route-loader.js editor/addons/v1.3.2-kv-route-loader.js
          cp /tmp/4n1f-source/editor/addons/v1.3.3-editor-route-nav.js editor/addons/v1.3.3-editor-route-nav.js

          mkdir -p docs
          cp /tmp/4n1f-source/docs/4N1F-LABS-BLUEPRINT-CHECKPOINT-V1.2.4.md docs/4N1F-LABS-BLUEPRINT-CHECKPOINT-V1.2.4.md

      - name: Add Cloudflare Pages routing
        run: |
          cat > _redirects <<'EOF'
          /p_* /preview.html 200
          /editor/p_* /editor/index.html 200
          EOF

      - name: Add Cloudflare Pages Functions
        run: |
          mkdir -p functions/api

          cat > functions/api/kv-session.js <<'EOF'
          const WORKER_URL = 'https://4n1f-kv-api.faqihanif12282000.workers.dev';

          function json(data, status = 200) {
            return new Response(JSON.stringify(data), {
              status,
              headers: {
                'content-type': 'application/json; charset=utf-8',
                'cache-control': 'no-store'
              }
            });
          }

          export async function onRequestPost({ request }) {
            let body;
            try {
              body = await request.json();
            } catch {
              return json({ success: false, message: 'Body JSON tidak valid.' }, 400);
            }

            const packageKey = String(body?.package_key || '').trim().toUpperCase();
            if (!/^4N1F_[A-F0-9]{12}$/.test(packageKey)) {
              return json({ success: false, message: 'Format Package Key tidak valid.' }, 400);
            }

            try {
              const response = await fetch(`${WORKER_URL}/session`, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'accept': 'application/json'
                },
                body: JSON.stringify({ package_key: packageKey })
              });

              const data = await response.json().catch(() => null);
              if (!response.ok) {
                return json(data || { success: false, message: `KV session gagal (${response.status}).` }, response.status);
              }
              return json(data || { success: false, message: 'Respons KV session kosong.' }, 200);
            } catch (error) {
              return json({ success: false, message: error?.message || 'Cloudflare KV session bridge gagal.' }, 502);
            }
          }

          export function onRequest() {
            return json({ success: false, message: 'Method not allowed.' }, 405);
          }
          EOF

          cat > functions/api/kv-preview.js <<'EOF'
          const WORKER_URL = 'https://4n1f-kv-api.faqihanif12282000.workers.dev';

          function json(data, status = 200) {
            return new Response(JSON.stringify(data), {
              status,
              headers: {
                'content-type': 'application/json; charset=utf-8',
                'cache-control': 'no-store'
              }
            });
          }

          export async function onRequestGet({ request }) {
            const url = new URL(request.url);
            const previewId = String(url.searchParams.get('preview_id') || '').trim().toLowerCase();
            if (!/^p_[a-f0-9]{32}$/.test(previewId)) {
              return json({ success: false, message: 'Preview ID tidak valid.' }, 400);
            }

            try {
              const response = await fetch(`${WORKER_URL}/preview/${encodeURIComponent(previewId)}`, {
                method: 'GET',
                headers: { 'accept': 'application/json' }
              });

              const data = await response.json().catch(() => null);
              if (!response.ok) {
                return json(data || { success: false, message: `KV preview gagal (${response.status}).` }, response.status);
              }
              return json(data || { success: false, message: 'Respons KV preview kosong.' }, 200);
            } catch (error) {
              return json({ success: false, message: error?.message || 'Cloudflare KV preview bridge gagal.' }, 502);
            }
          }

          export function onRequest() {
            return json({ success: false, message: 'Method not allowed.' }, 405);
          }
          EOF

      - name: Add Cloudflare project documentation
        run: |
          cat > CLOUDFLARE-SETUP.md <<'EOF'
          # 4N1F Labs Cinematic — Cloudflare deployment

          This repository is the independent Cloudflare edition. The frozen Vercel repository is not modified by this project.

          ## Source snapshot

          Frontend/editor source is pinned to:

          `danikrakatau1/4NIF-Labs-Cinematic@0e7119054a3e1d88a97f03f4d53138ef89ba9edc`

          ## Active routes

          - `/` → Universal Preview Hub
          - `/p_<preview-id>` → `preview.html`
          - `/editor/p_<preview-id>` → `editor/index.html`
          - `/api/kv-session` → Cloudflare Pages Function → existing `4n1f-kv-api` Worker
          - `/api/kv-preview` → Cloudflare Pages Function → existing `4n1f-kv-api` Worker

          ## Cloudflare Pages setup

          Connect this GitHub repository as a Cloudflare Pages project.

          Recommended settings:

          - Production branch: `main`
          - Framework preset: None
          - Build command: leave empty
          - Build output directory: `/`
          - Root directory: `/`

          Pages Functions are automatically detected from the `functions/` directory.

          ## Storage

          Existing Cloudflare Worker:

          `https://4n1f-kv-api.faqihanif12282000.workers.dev`

          Existing KV remains the package/preview backend. Browser code never receives a publisher token or service-role secret.

          ## Deliberately excluded

          The Cloudflare edition does not copy inactive Vercel/R2 server files such as `api/r2-*`, `server/r2-*`, `docs/R2-DUAL-STORAGE-SETUP.md`, `vercel.json`, or the old R2 editor bridge.
          EOF

          cat > README.md <<'EOF'
          # 4N1F Labs Cinematic — Cloudflare

          Independent Cloudflare edition of 4N1F Labs Cinematic.

          The Vercel edition is treated as frozen. This repository reuses the proven editor/preview engine from a pinned source snapshot while Cloudflare-specific hosting, routing, Functions, and future UI work evolve here independently.

          ## Locked navigation

          - `/` → Universal Preview Hub
          - `/p_<preview-id>` → Clean Live Preview
          - `/editor/p_<preview-id>` → Live Editor

          ## Backend

          Cloudflare Pages Functions proxy the same-origin `/api/kv-session` and `/api/kv-preview` routes to the existing `4n1f-kv-api` Worker and KV storage.

          ## Safety

          No publisher token, Supabase service-role key, or other server secret belongs in browser code or commits.

          See `CLOUDFLARE-SETUP.md` for deployment settings.
          EOF

      - name: Validate active source
        run: |
          node --check editor/background-fluid.js
          node --check editor/editor.js
          node --check editor/addons/v1.2.3-layer-engine.js
          node --check editor/addons/v1.2.4-align-responsive.js
          node --check editor/addons/v1.2.5-multiselect-group.js
          node --check editor/addons/v1.3.2-kv-route-loader.js
          node --check editor/addons/v1.3.3-editor-route-nav.js
          node --check functions/api/kv-session.js
          node --check functions/api/kv-preview.js
          grep -q 'Universal Preview Hub' index.html
          grep -q 'Open Live Editor' preview.html
          grep -q 'backPreviewBtn' editor/index.html
          test ! -e editor/addons/v1.3.0-r2-dual-storage.js

      - name: Commit bootstrapped Cloudflare source
        run: |
          git config user.name 'danikrakatau1'
          git config user.email 'danikrakatau1@gmail.com'
          git add README.md CLOUDFLARE-SETUP.md _redirects index.html preview.html editor functions docs
          if git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
            exit 0
          fi
          git commit -m 'Bootstrap Cloudflare edition from frozen V0.3.1 snapshot'
          git push origin main
