name: Hub V8 Interaction Energy Check

on:
  push:
    branches:
      - style/hub-v8-interaction-energy-v1
      - main
  pull_request:
    paths:
      - 'hub-portals-v6.css'
      - '.github/workflows/hub-v8-interaction-energy-check.yml'

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V8 Interaction Energy contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V8 STEP 2 — INTERACTION ENERGY' hub-portals-v6.css
          grep -q 'Existing WebGL pointer field remains the ambient cursor energy' hub-portals-v6.css
          grep -q '.row:focus-within' hub-portals-v6.css
          grep -q 'Generate is dormant at rest' hub-portals-v6.css
          grep -q '@media(hover:hover) and (pointer:fine)' hub-portals-v6.css
          grep -q 'Keyboard users receive the same energy hierarchy' hub-portals-v6.css
          grep -q '@media(hover:none),(pointer:coarse)' hub-portals-v6.css
          grep -q 'prefers-reduced-motion:reduce' hub-portals-v6.css

      - name: Verify Step 2 has no looping choreography
        shell: bash
        run: |
          set -euo pipefail
          awk '/V8 STEP 2 — INTERACTION ENERGY/{capture=1} capture{print}' hub-portals-v6.css > /tmp/v8-step2.css
          if grep -q '@keyframes' /tmp/v8-step2.css; then
            echo 'Step 2 must stay interaction-driven; looping choreography belongs to Step 3.' >&2
            exit 1
          fi

      - name: Verify architecture semantics remain intact
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/kv-package?package_key=' editor/package-preview.html
          grep -q '/api/kv-session' editor/package-preview.html
          grep -q '4N1F_' index.html
          grep -q 'p_' index.html

      - name: Build full Cloudflare bundle
        run: bash build-cloudflare.sh
