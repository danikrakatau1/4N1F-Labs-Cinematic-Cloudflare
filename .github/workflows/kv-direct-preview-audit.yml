name: KV Direct Preview Audit

on:
  push:
    branches:
      - audit/kv-direct-preview-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect canonical KV namespace and sample package keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NS_ID='f5d2286e18e8401aa40ec9d8591bf8b6'
          echo "NAMESPACE_ID=$NS_ID"
          echo '=== pkg: keys ==='
          npx --yes wrangler@latest kv key list --remote --namespace-id "$NS_ID" --prefix 'pkg:' > /tmp/pkg.json
          cat /tmp/pkg.json | head -c 12000
          echo
          echo '=== prev: keys ==='
          npx --yes wrangler@latest kv key list --remote --namespace-id "$NS_ID" --prefix 'prev:' > /tmp/prev.json
          cat /tmp/prev.json | head -c 12000
          echo
          echo '=== proj: keys ==='
          npx --yes wrangler@latest kv key list --remote --namespace-id "$NS_ID" --prefix 'proj:' > /tmp/proj.json
          cat /tmp/proj.json | head -c 12000
          echo
          echo '=== first pkg value shape ==='
          FIRST_PKG="$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/pkg.json','utf8'));const x=a[0];if(!x)process.exit(2);process.stdout.write(x.name)")"
          echo "FIRST_PKG_KEY=$FIRST_PKG"
          npx --yes wrangler@latest kv key get "$FIRST_PKG" --remote --namespace-id "$NS_ID" > /tmp/pkg-value.txt
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/pkg-value.txt','utf8');
          let v; try { v=JSON.parse(raw); } catch { console.log('VALUE_IS_NON_JSON bytes='+Buffer.byteLength(raw)); process.exit(0); }
          const out={};
          for (const [k,val] of Object.entries(v)) {
            if (typeof val==='string') out[k]=k.toLowerCase().includes('token')?'[redacted]':(val.length>180?`[string ${val.length} chars]`:val);
            else if (Array.isArray(val)) out[k]=`[array ${val.length}]`;
            else if (val && typeof val==='object') out[k]=`[object keys: ${Object.keys(val).slice(0,12).join(',')}]`;
            else out[k]=val;
          }
          console.log(JSON.stringify(out,null,2));
          NODE
