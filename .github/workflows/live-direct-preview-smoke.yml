name: Live Direct Preview Smoke

on:
  push:
    branches:
      - test/live-direct-preview-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify direct package endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://4n1f-labs-cinematic-cloudflare.faqihanif12282000.workers.dev'
          KEY='4N1F_4CF2BA8CB435'
          curl -fsS --retry 3 --retry-delay 2 "$BASE/api/kv-package?package_key=$KEY" > /tmp/package.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/package.json','utf8'));
          if(!d.success) throw new Error('success=false');
          if(d.package_key!=='4N1F_4CF2BA8CB435') throw new Error('wrong key');
          if(!String(d.html_code||'').includes('4N1F KV OK')) throw new Error('html payload missing');
          console.log('DIRECT PACKAGE API PASS', d.storage_engine, d.project);
          NODE
      - name: Verify live preview shell after redirect
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://4n1f-labs-cinematic-cloudflare.faqihanif12282000.workers.dev'
          KEY='4N1F_4CF2BA8CB435'
          curl -LfsS --retry 3 --retry-delay 2 "$BASE/editor/package-preview.html?package_key=$KEY&cb=$(date +%s)" > /tmp/preview.html
          grep -Fq '/api/kv-package?package_key=' /tmp/preview.html
          grep -Fq 'loadPackage(packageKey)' /tmp/preview.html
          echo 'PREVIEW-ONLY SHELL PASS'
      - name: Compare direct and bridged editor session POST
        shell: bash
        run: |
          set -euo pipefail
          BACK='https://4n1f-kv-api.faqihanif12282000.workers.dev'
          BASE='https://4n1f-labs-cinematic-cloudflare.faqihanif12282000.workers.dev'
          KEY='4N1F_4CF2BA8CB435'
          payload="{\"package_key\":\"$KEY\"}"
          direct_code="$(curl -sS -o /tmp/direct.json -w '%{http_code}' -X POST "$BACK/session" -H 'content-type: application/json' --data "$payload")"
          bridge_code="$(curl -sS -o /tmp/bridge.json -w '%{http_code}' -X POST "$BASE/api/kv-session" -H 'content-type: application/json' --data "$payload")"
          echo "DIRECT POST /session -> $direct_code :: $(head -c 500 /tmp/direct.json | tr '\n' ' ')"
          echo "BRIDGE POST /api/kv-session -> $bridge_code :: $(head -c 500 /tmp/bridge.json | tr '\n' ' ')"
          test "$direct_code" = '200'
          test "$bridge_code" = '200'
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['/tmp/direct.json','/tmp/bridge.json']){
            const d=JSON.parse(fs.readFileSync(f,'utf8'));
            if(!d.success || !/^p_[a-f0-9]{32}$/i.test(String(d.preview_id||''))) throw new Error(`${f}: invalid session`);
          }
          console.log('EDITOR SESSION SPLIT PASS');
          NODE
