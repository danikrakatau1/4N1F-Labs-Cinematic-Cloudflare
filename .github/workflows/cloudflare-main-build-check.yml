name: Cloudflare Main Build Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe clean Fetch payloads
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/fetch-probe

          inspect_gz() {
            local name="$1" gz="$2"
            echo "--- ${name} ---"
            local sha size
            sha=$(sha256sum "$gz" | awk '{print $1}')
            size=$(wc -c < "$gz")
            echo "sha=${sha} bytes=${size}"
            if gzip -t "$gz" 2>/dev/null && tar -tzf "$gz" >/dev/null 2>&1; then
              echo "PASS ${name}"
              tar -tzf "$gz" | head -30
            else
              echo "FAIL ${name}: gzip/tar"
            fi
          }

          {
            base64 -d vendor/fetch-v226-clean/part-00.b64
            base64 -d vendor/fetch-v226-clean/part-01.b64
            base64 -d vendor/fetch-v226-clean/part-02.b64
          } > /tmp/fetch-probe/clean-parts.tar.gz || true
          inspect_gz clean_parts_binary_join /tmp/fetch-probe/clean-parts.tar.gz

          {
            base64 -d vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-00
            base64 -d vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-01
            base64 -d vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-02
            base64 -d vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-03a
            base64 -d vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-03b
            base64 -d vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-03c
            base64 -d vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-03d
          } > /tmp/fetch-probe/clean-source.tar.gz || true
          inspect_gz clean_source_binary_join /tmp/fetch-probe/clean-source.tar.gz

          if [ -s vendor/fetch-v226-final/part-00 ]; then
            base64 -d vendor/fetch-v226-final/part-00 > /tmp/fetch-probe/final-current.tar.gz || true
            inspect_gz final_current /tmp/fetch-probe/final-current.tar.gz
          fi

      - name: Build Cloudflare bundle
        shell: bash
        run: bash build-cloudflare.sh

      - name: Verify homepage Fetch gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="hub-gate hub-gate-fetch" href="/fetch/"' dist/index.html
          grep -q '<strong>FETCH</strong>' dist/index.html
          ! grep -q 'Masukkan Package Key untuk membuat sesi Preview baru' dist/index.html

      - name: Verify Fetch V2.26 output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/fetch/index.html
          test -f dist/fetch/preview.html
          test -f dist/fetch/editor/index.html
          grep -q '4N1F LABS · FETCH ENGINE V2.26' dist/fetch/index.html
          echo 'Cloudflare main bundle verified.'
