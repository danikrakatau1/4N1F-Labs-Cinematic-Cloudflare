name: Cloudflare Recovery Build Check

on:
  push:
    branches:
      - main
      - fetch-v226-pristine-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan pristine Fetch chunks
        shell: bash
        run: |
          set -euo pipefail
          files=(vendor/fetch-v226-pristine/part-{00..10}.b64 vendor/fetch-v226-pristine/tail-{00..05}.b64)
          total=0
          for f in "${files[@]}"; do
            bytes=$(wc -c < "$f")
            bad=$(LC_ALL=C tr -d 'A-Za-z0-9+/=\r\n' < "$f" | wc -c)
            printf '%s bytes=%s badchars=%s\n' "$f" "$bytes" "$bad"
            total=$((total + bytes))
            test "$bad" -eq 0
          done
          echo "TOTAL_CHARS=$total"
          test "$total" -eq 153424
          cat "${files[@]}" > /tmp/pristine.b64
          base64 -d /tmp/pristine.b64 > /tmp/pristine.tar.gz
          sha256sum /tmp/pristine.tar.gz
          echo 'b7ce8462dece1f872284f4cfaf139fcbfd68a569b55950e90215e85dedd293bb  /tmp/pristine.tar.gz' | sha256sum -c -
          tar -tzf /tmp/pristine.tar.gz >/dev/null
          echo 'PRISTINE_STREAM_PASS=1'

      - name: Build Cloudflare bundle
        shell: bash
        run: bash build-cloudflare.sh

      - name: Verify homepage Fetch gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="hub-gate hub-gate-fetch" href="/fetch/"' dist/index.html
          grep -q '<strong>FETCH</strong>' dist/index.html
          ! grep -q 'Masukkan Package Key untuk membuat sesi Preview baru' dist/index.html

      - name: Verify Fetch V2.26 output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/fetch/index.html
          test -f dist/fetch/preview.html
          test -f dist/fetch/editor/index.html
          grep -q '4N1F LABS · FETCH ENGINE V2.26' dist/fetch/index.html
          echo 'Cloudflare recovery bundle verified.'
