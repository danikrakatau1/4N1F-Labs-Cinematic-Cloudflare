name: Cloudflare Recovery Build Check

on:
  push:
    branches:
      - main
      - fetch-v226-pristine-recovery
      - fetch-premium-v1
      - fetch-premium-v2
      - status-motion-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate missing pristine part-10 character
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('vendor/fetch-v226-pristine/part-10.b64')
          data = p.read_bytes()
          target = 'a570cdd50b3194bad5ec52185bd3120232cd81790a0dfc7923c97f69cd589d5b'
          print('PART10_BYTES=', len(data))
          print('PART10_SHA=', hashlib.sha256(data).hexdigest())
          if len(data) == 12000 and hashlib.sha256(data).hexdigest() == target:
              print('PART10_ALREADY_EXACT=1')
              raise SystemExit(0)
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          for pos in range(len(data) + 1):
              prefix = data[:pos]
              suffix = data[pos:]
              for ch in alphabet:
                  candidate = prefix + bytes([ch]) + suffix
                  if hashlib.sha256(candidate).hexdigest() == target:
                      print(f'MISSING_POS={pos}')
                      print(f'MISSING_CHAR={chr(ch)}')
                      print('PART10_RECOVERY_FOUND=1')
                      raise SystemExit(0)
          raise SystemExit('No one-character insertion matches expected pristine part-10 SHA')
          PY

      - name: Scan pristine Fetch chunks
        shell: bash
        run: |
          set -euo pipefail
          files=(vendor/fetch-v226-pristine/part-{00..10}.b64 vendor/fetch-v226-pristine/tail-{00..05}.b64)
          total=0
          for f in "${files[@]}"; do
            bytes=$(wc -c < "$f")
            bad=$(LC_ALL=C tr -d 'A-Za-z0-9+/=\r\n' < "$f" | wc -c)
            printf '%s bytes=%s badchars=%s\n' "$f" "$bytes" "$bad"
            total=$((total + bytes))
          done
          echo "TOTAL_CHARS=$total"

      - name: Build Cloudflare bundle
        shell: bash
        run: bash build-cloudflare.sh

      - name: Verify homepage Fetch gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="hub-gate hub-gate-fetch" href="/fetch/"' dist/index.html
          grep -q '<strong>FETCH</strong>' dist/index.html
          ! grep -q 'Masukkan Package Key untuk membuat sesi Preview baru' dist/index.html
          grep -q 'status-motion-v1.css' dist/index.html
          grep -q 'status-motion-v1.js' dist/index.html

      - name: Verify Fetch V2.26 output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/status-motion-v1.css
          test -f dist/status-motion-v1.js
          test -f dist/fetch/index.html
          test -f dist/fetch/studio.css
          test -f dist/fetch/quantum.js
          test -f dist/fetch/preview.html
          test -f dist/fetch/editor/index.html
          grep -q '4N1F LABS · FETCH ENGINE V2.26' dist/fetch/index.html
          grep -q 'name="4n1f-fetch-ui" content="premium-v2-quantum"' dist/fetch/index.html
          grep -q 'QUANTUM CONSOLE' dist/fetch/index.html
          grep -q 'pipeline-strip' dist/fetch/index.html
          grep -q 'dormant-graph' dist/fetch/index.html
          grep -q 'quantum.js' dist/fetch/index.html
          grep -q 'status-motion-v1.css' dist/fetch/index.html
          grep -q 'status-motion-v1.js' dist/fetch/index.html
          grep -q "'home-preview'" dist/status-motion-v1.js
          grep -q 'fetchSourceBtn' dist/status-motion-v1.js
          grep -q 'analyzeBtn' dist/status-motion-v1.js
          grep -q 'buildBtn' dist/status-motion-v1.js
          grep -q 'previewBtn' dist/status-motion-v1.js
          node --check dist/status-motion-v1.js
          node --check dist/fetch/quantum.js
          echo 'Cloudflare Global Status Motion V1 + Fetch Premium V2 bundle verified.'
