name: Cloudflare Main Build Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe clean Fetch payloads
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/fetch-probe
          probe() {
            local name="$1" b64="$2"
            local gz="/tmp/fetch-probe/${name}.tar.gz"
            echo "--- ${name} ---"
            if ! base64 -di "$b64" > "$gz" 2>/dev/null; then
              echo "FAIL ${name}: base64 decode"
              return 0
            fi
            local sha size
            sha=$(sha256sum "$gz" | awk '{print $1}')
            size=$(wc -c < "$gz")
            echo "sha=${sha} bytes=${size}"
            if gzip -t "$gz" 2>/dev/null && tar -tzf "$gz" >/dev/null 2>&1; then
              echo "PASS ${name}"
              tar -tzf "$gz" | head -30
            else
              echo "FAIL ${name}: gzip/tar"
            fi
          }

          cat vendor/fetch-v226-clean/part-00.b64 \
              vendor/fetch-v226-clean/part-01.b64 \
              vendor/fetch-v226-clean/part-02.b64 \
            > /tmp/fetch-probe/clean-parts.b64
          probe clean_parts /tmp/fetch-probe/clean-parts.b64

          cat vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-00 \
              vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-01 \
              vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-02 \
              vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-03a \
              vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-03b \
              vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-03c \
              vendor/fetch-v226-clean/fetch-v226-clean-source.b64.part-03d \
            > /tmp/fetch-probe/clean-source.b64
          probe clean_source /tmp/fetch-probe/clean-source.b64

          if [ -s vendor/fetch-v226-final/part-00 ]; then
            cp vendor/fetch-v226-final/part-00 /tmp/fetch-probe/final-current.b64
            probe final_current /tmp/fetch-probe/final-current.b64
          fi

      - name: Build Cloudflare bundle
        shell: bash
        run: bash build-cloudflare.sh

      - name: Verify homepage Fetch gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="hub-gate hub-gate-fetch" href="/fetch/"' dist/index.html
          grep -q '<strong>FETCH</strong>' dist/index.html
          ! grep -q 'Masukkan Package Key untuk membuat sesi Preview baru' dist/index.html

      - name: Verify Fetch V2.26 output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/fetch/index.html
          test -f dist/fetch/preview.html
          test -f dist/fetch/editor/index.html
          grep -q '4N1F LABS · FETCH ENGINE V2.26' dist/fetch/index.html
          echo 'Cloudflare main bundle verified.'
