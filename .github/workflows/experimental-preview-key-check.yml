name: Experimental Preview Key Check

on:
  push:
    branches:
      - 'lab/**'
      - main
    paths:
      - 'preview.html'
      - 'editor/webgl-lab/**'
      - '.github/workflows/experimental-preview-key-check.yml'
  pull_request:
    paths:
      - 'preview.html'
      - 'editor/webgl-lab/**'
      - '.github/workflows/experimental-preview-key-check.yml'

permissions:
  contents: read

jobs:
  isolated-preview-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated route and asset page
        shell: bash
        run: |
          set -euo pipefail
          KEY='p_3fd3805d11ab7117a73a47837c082f1a'
          TARGET='/editor/webgl-lab/painterly-v1/index.html'
          test -s editor/webgl-lab/painterly-v1/index.html
          grep -Fq "$KEY" preview.html
          grep -Fq "$TARGET" preview.html
          grep -Fq 'p_8c5360de7ef242a08cfd0adb37421d68' preview.html
          grep -Fq '/api/kv-preview?preview_id=' preview.html
          ! grep -Rq 'wrangler deploy\|vercel --prod\|npx vercel' editor/webgl-lab/painterly-v1
          echo 'EXPERIMENTAL PREVIEW KEY ISOLATION PASS'
